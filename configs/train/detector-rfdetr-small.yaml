schema_version: 1
model:
  family: rfdetr
  variant: small
  pretrained: true
  class_names:
    - container_number

data:
  dataset_dir: data/processed/detection-v1
  dataset_manifest: data/processed/detection-v1/manifest.jsonl
  split_manifest: data/processed/detection-v1/split_manifest.jsonl
training:
  device: auto
  seed: 6346
  epochs: 100
  batch_size: 4
  grad_accum_steps: 4
  learning_rate: 0.0001
  use_ema: true
  early_stopping: true
  early_stopping_patience: 15
  checkpoint_interval: 5
  tensorboard: true
  wandb: false
  gradient_checkpointing: false
  resolution: default
output:
  root: runs/detector